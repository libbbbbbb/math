<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>116 學測數學 - 多項式函數特訓</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom Scrollbar for Chat */
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .chat-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- MathJax for rendering math formulas -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-gsat-math-app';
        let firebaseConfig = {};
        try {
            firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        } catch (e) { console.error("Firebase config error", e); }

        // Make Firebase accessible globally for React component
        window.firebaseApp = Object.keys(firebaseConfig).length > 0 ? initializeApp(firebaseConfig) : null;
        window.db = window.firebaseApp ? getFirestore(window.firebaseApp) : null;
        window.auth = window.firebaseApp ? getAuth(window.firebaseApp) : null;
        window.appId = appId;
        
        window.firebaseModules = { collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, signInAnonymously, onAuthStateChanged };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 題目資料庫
        const QUIZ_DATA = [
            {
                id: 1,
                type: '單選題',
                question: '若多項式 \\( f(x) \\) 除以 \\( x-1 \\) 餘 2，除以 \\( x+2 \\) 餘 -4，則 \\( f(x) \\) 除以 \\( (x-1)(x+2) \\) 的餘式為何？',
                options: ['\\( 2x \\)', '\\( 2x-1 \\)', '\\( 2x+1 \\)', '\\( x+1 \\)', '\\( x-1 \\)'],
                correctAnswer: 0,
                hint: '回想餘式定理：除以二次式的餘式，最高為一次式，可假設為 \\( ax+b \\)。'
            },
            {
                id: 2,
                type: '多選題',
                question: '已知三次實係數多項式 \\( f(x) = ax^3 + bx^2 + cx + d \\) 的圖形對稱中心為 \\( (1, 2) \\)，且 \\( f(0) = 0 \\)。下列敘述哪些正確？',
                options: [
                    '\\( f(2) = 4 \\)',
                    '\\( a + b + c + d = 2 \\)',
                    '\\( b = -3a \\)',
                    '此函數圖形必交 x 軸於三個相異點',
                    '若 \\( f(x) \\) 除以 \\( x-1 \\) 餘式為 \\( r(x) \\)，則 \\( r(x) = 2 \\)'
                ],
                correctAnswers: [0, 1, 2, 4],
                hint: '三次函數的對稱中心有什麼幾何特性？點對稱可以如何利用代數式表達？'
            }
        ];

        const SYSTEM_PROMPT = `你是一位專精於台灣「108課綱學測數學（數A/數B）」的學測家教。你的目標是透過引導式（蘇格拉底式）教學，培養學生的數學直覺、邏輯拆解力與解題策略，而非直接灌輸答案。

1. 獨立驗證與診斷先行：在回應學生之前，先在背景獨立進行步驟化計算與推導。若學生提供解答或算式，不要第一句話直接回答「正確」或「錯誤」。先比對學生的推導過程，明確指出其觀念盲點、代數計算錯誤或幾何直覺偏差。
2. 階段式引導教學：不要直接給出完整解答。要將題目拆解為 2-3 個核心步驟（Step 1：關鍵概念識別，Step 2：核心公式，Step 3：代數推導）。每輪回應只給出當前步驟的思考提示，並提出 1 個具體的引導問題讓學生回答。
3. 結構化輸出格式：每次分析題目時，固定提供以下模組（放在回應開頭，使用 Markdown 格式）：
----------------------------------------
**單元重點**：[例如：多項式函數]
**核心考點**：[例如：餘式定理與多項式假設法]
**關鍵突破口**：[1-2 句話點出該題最核心的思維轉折點]
----------------------------------------
4. 語氣與溝通風格：態度扎實、切中要害。說明概念時儘量圖像化、具體化。輸出數學式請使用 LaTeX 格式（例如 \\( x^2 + 1 \\) 或 $$ x^2 + 1 $$）。`;

        // 用於觸發 MathJax 渲染的 Hook
        const useMathJax = (content) => {
            useEffect(() => {
                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise();
                }
            }, [content]);
        };

        const MockTest = ({ onFinishTest, navigateToTutor }) => {
            const [answers, setAnswers] = useState({});
            const [submitted, setSubmitted] = useState(false);
            useMathJax(answers);

            const handleSingleSelect = (qId, optIdx) => {
                if (submitted) return;
                setAnswers(prev => ({ ...prev, [qId]: optIdx }));
            };

            const handleMultiSelect = (qId, optIdx) => {
                if (submitted) return;
                setAnswers(prev => {
                    const curr = prev[qId] || [];
                    if (curr.includes(optIdx)) {
                        return { ...prev, [qId]: curr.filter(i => i !== optIdx) };
                    } else {
                        return { ...prev, [qId]: [...curr, optIdx] };
                    }
                });
            };

            const calculateScore = () => {
                let correct = 0;
                QUIZ_DATA.forEach(q => {
                    if (q.type === '單選題') {
                        if (answers[q.id] === q.correctAnswer) correct++;
                    } else {
                        const ans = answers[q.id] || [];
                        const isCorrect = ans.length === q.correctAnswers.length && 
                                          ans.every(val => q.correctAnswers.includes(val));
                        if (isCorrect) correct++;
                    }
                });
                return correct;
            };

            const submitTest = () => {
                if (Object.keys(answers).length < QUIZ_DATA.length) {
                    alert('請完成所有題目後再繳卷！(實際應用應使用 Modal)');
                    return;
                }
                setSubmitted(true);
            };

            return (
                <div className="max-w-3xl mx-auto p-4 md:p-6 pb-20">
                    <h2 className="text-2xl font-bold text-slate-800 mb-6 flex items-center">
                        <svg className="w-6 h-6 mr-2 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        第三冊 多項式函數 實戰模擬
                    </h2>
                    
                    {QUIZ_DATA.map((q, idx) => (
                        <div key={q.id} className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6">
                            <div className="flex justify-between items-start mb-4">
                                <span className="inline-block px-3 py-1 bg-indigo-100 text-indigo-800 text-sm font-semibold rounded-full">
                                    第 {idx + 1} 題 ({q.type})
                                </span>
                            </div>
                            <p className="text-lg text-slate-800 mb-6 leading-relaxed" dangerouslySetInnerHTML={{__html: q.question}} />
                            
                            <div className="space-y-3">
                                {q.options.map((opt, optIdx) => {
                                    let isSelected = q.type === '單選題' 
                                        ? answers[q.id] === optIdx 
                                        : (answers[q.id] || []).includes(optIdx);
                                    
                                    let btnClass = "w-full text-left p-4 rounded-lg border-2 transition-all duration-200 ";
                                    if (submitted) {
                                        const isCorrectOpt = q.type === '單選題' 
                                            ? q.correctAnswer === optIdx 
                                            : q.correctAnswers.includes(optIdx);
                                        
                                        if (isCorrectOpt) btnClass += "bg-green-50 border-green-500 text-green-900 ";
                                        else if (isSelected && !isCorrectOpt) btnClass += "bg-red-50 border-red-500 text-red-900 ";
                                        else btnClass += "border-slate-100 bg-slate-50 opacity-50 ";
                                    } else {
                                        btnClass += isSelected ? "border-indigo-500 bg-indigo-50" : "border-slate-200 hover:border-indigo-300 hover:bg-slate-50";
                                    }

                                    return (
                                        <button 
                                            key={optIdx} 
                                            onClick={() => q.type === '單選題' ? handleSingleSelect(q.id, optIdx) : handleMultiSelect(q.id, optIdx)}
                                            className={btnClass}
                                            disabled={submitted}
                                        >
                                            <span className="mr-3 font-semibold text-slate-500">
                                                ({String.fromCharCode(65 + optIdx)})
                                            </span>
                                            <span dangerouslySetInnerHTML={{__html: opt}} />
                                        </button>
                                    );
                                })}
                            </div>

                            {submitted && (
                                <div className="mt-6 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                                    <p className="text-yellow-800 text-sm font-medium mb-2">💡 觀念提示</p>
                                    <p className="text-yellow-900 text-sm" dangerouslySetInnerHTML={{__html: q.hint}} />
                                    <button 
                                        onClick={() => navigateToTutor(`我剛才在測驗中寫了這題：「${q.question}」。我不太懂這題的觀念，可以引導我嗎？`)}
                                        className="mt-3 text-sm text-indigo-600 font-semibold hover:text-indigo-800 flex items-center"
                                    >
                                        👉 帶著這題去問 AI 小老師
                                    </button>
                                </div>
                            )}
                        </div>
                    ))}

                    {!submitted ? (
                        <button 
                            onClick={submitTest}
                            className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-xl shadow-md transition-colors"
                        >
                            繳交試卷
                        </button>
                    ) : (
                        <div className="bg-indigo-600 text-white p-6 rounded-xl text-center shadow-md">
                            <h3 className="text-xl font-bold mb-2">測驗結果</h3>
                            <p className="text-3xl font-black mb-4">{calculateScore()} / {QUIZ_DATA.length} 題正確</p>
                            <p className="mb-4 text-indigo-100">學測是一場馬拉松，重點是找出盲點並修正！</p>
                            <button 
                                onClick={() => navigateToTutor("我剛才完成了多項式函數的模擬測驗，希望能和你一起檢討我不熟的觀念。")}
                                className="bg-white text-indigo-600 font-bold py-2 px-6 rounded-full hover:bg-indigo-50 transition-colors"
                            >
                                找家教檢討
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const TutorChat = ({ initialMessage }) => {
            const [messages, setMessages] = useState([
                { role: 'model', text: '你好！我是你的專屬學測數學家教。無論是剛才測驗的題目，還是你手邊有不會的多項式難題，我們都可以一起拆解。你要問哪一題呢？' }
            ]);
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const messagesEndRef = useRef(null);

            // Hook for rendering MathJax in chat
            const chatContentStr = messages.map(m => m.text).join(' ');
            useMathJax(chatContentStr);

            useEffect(() => {
                if (initialMessage && messages.length === 1) {
                    setInput(initialMessage);
                }
                scrollToBottom();
            }, [messages, initialMessage]);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            const handleSend = async () => {
                if (!input.trim() || isLoading) return;
                
                const userText = input.trim();
                const newMessages = [...messages, { role: 'user', text: userText }];
                setMessages(newMessages);
                setInput('');
                setIsLoading(true);

                try {
                    const apiKey = ""; // API key managed by environment
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                    
                    const payload = {
                        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
                        contents: newMessages.map(msg => ({
                            role: msg.role === 'model' ? 'model' : 'user',
                            parts: [{ text: msg.text }]
                        }))
                    };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error('API Request Failed');
                    
                    const result = await response.json();
                    const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text || '抱歉，小老師腦袋卡住了，請再問一次！';
                    
                    setMessages([...newMessages, { role: 'model', text: aiText }]);
                } catch (error) {
                    console.error("AI Error:", error);
                    setMessages([...newMessages, { role: 'model', text: '伺服器連線異常，請稍後再試。' }]);
                } finally {
                    setIsLoading(false);
                }
            };

            const formatMarkdown = (text) => {
                // Simple markdown parsing for bold and line breaks
                let html = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/\n/g, '<br/>');
                // MathJax takes care of \( ... \) and $$ ... $$ automatically after rendering HTML
                return html;
            };

            return (
                <div className="max-w-4xl mx-auto h-[calc(100vh-80px)] flex flex-col p-2 md:p-4">
                    <div className="bg-white flex-1 rounded-xl shadow-sm border border-slate-200 flex flex-col overflow-hidden">
                        
                        <div className="bg-indigo-600 p-4 text-white flex justify-between items-center">
                            <div>
                                <h2 className="font-bold text-lg">💡 蘇格拉底 AI 數學家教</h2>
                                <p className="text-indigo-200 text-xs">專精 108 課綱｜引導思考，不直接給答案</p>
                            </div>
                            <span className="flex h-3 w-3 relative">
                                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                                <span className="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                            </span>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 chat-scroll space-y-4">
                            {messages.map((msg, idx) => (
                                <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    {msg.role === 'model' && (
                                        <div className="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center mr-2 flex-shrink-0 mt-1">
                                            👨‍🏫
                                        </div>
                                    )}
                                    <div className={`max-w-[85%] p-4 rounded-2xl ${msg.role === 'user' ? 'bg-slate-800 text-white rounded-tr-none' : 'bg-slate-50 border border-slate-200 text-slate-800 rounded-tl-none'}`}>
                                        <div dangerouslySetInnerHTML={{ __html: formatMarkdown(msg.text) }} className="leading-relaxed whitespace-pre-wrap" />
                                    </div>
                                </div>
                            ))}
                            {isLoading && (
                                <div className="flex justify-start">
                                    <div className="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center mr-2">👨‍🏫</div>
                                    <div className="bg-slate-50 border border-slate-200 p-4 rounded-2xl rounded-tl-none">
                                        <span className="animate-pulse">小老師正在計算並分析考點...</span>
                                    </div>
                                </div>
                            )}
                            <div ref={messagesEndRef} />
                        </div>

                        <div className="p-4 bg-slate-50 border-t border-slate-200">
                            <div className="flex items-center space-x-2">
                                <textarea 
                                    value={input}
                                    onChange={(e) => setInput(e.target.value)}
                                    onKeyDown={(e) => {
                                        if (e.key === 'Enter' && !e.shiftKey) {
                                            e.preventDefault();
                                            handleSend();
                                        }
                                    }}
                                    placeholder="輸入你的算式、遇到的瓶頸或題目..."
                                    className="flex-1 resize-none border border-slate-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 max-h-32"
                                    rows="2"
                                />
                                <button 
                                    onClick={handleSend}
                                    disabled={isLoading || !input.trim()}
                                    className="bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-xl disabled:opacity-50 transition-colors self-end"
                                >
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                                </button>
                            </div>
                            <p className="text-xs text-slate-400 mt-2 text-center">提示：可以上傳題目的文字敘述，或分享你的第一步算式讓家教診斷。</p>
                        </div>
                    </div>
                </div>
            );
        };

        const DiscussionRoom = () => {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [username, setUsername] = useState('');
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const messagesEndRef = useRef(null);
            
            // Re-render math when messages change
            const chatStr = messages.map(m => m.text).join(' ');
            useMathJax(chatStr);

            useEffect(() => {
                if (!window.auth) return;
                
                const { onAuthStateChanged, signInAnonymously } = window.firebaseModules;
                
                const unsubscribe = onAuthStateChanged(window.auth, (user) => {
                    if (user) {
                        setIsLoggedIn(true);
                        setupListener();
                    } else {
                        signInAnonymously(window.auth).catch(err => console.error("Auth error", err));
                    }
                });

                return () => unsubscribe();
            }, []);

            const setupListener = () => {
                if (!window.db || !window.appId) return;
                
                const { collection, query, orderBy, onSnapshot } = window.firebaseModules;
                
                // Rule 1: Use specific artifacts path for public data
                const messagesRef = collection(window.db, 'artifacts', window.appId, 'public', 'data', 'forumMessages');
                // Rule 2: Simple query
                const q = query(messagesRef, orderBy('createdAt', 'asc'));

                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const loadedMessages = [];
                    snapshot.forEach((doc) => {
                        loadedMessages.push({ id: doc.id, ...doc.data() });
                    });
                    setMessages(loadedMessages);
                    messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
                }, (error) => {
                    console.error("Firestore Error:", error);
                });

                return unsubscribe;
            };

            const handleSend = async (e) => {
                e.preventDefault();
                if (!input.trim() || !username.trim() || !isLoggedIn) return;

                const { collection, addDoc, serverTimestamp } = window.firebaseModules;
                const messagesRef = collection(window.db, 'artifacts', window.appId, 'public', 'data', 'forumMessages');
                
                try {
                    await addDoc(messagesRef, {
                        text: input.trim(),
                        user: username.trim(),
                        userId: window.auth.currentUser.uid,
                        createdAt: serverTimestamp()
                    });
                    setInput('');
                } catch (err) {
                    console.error("Error sending msg", err);
                }
            };

            if (!window.firebaseApp) {
                return (
                    <div className="flex justify-center items-center h-64">
                        <p className="text-slate-500">系統未連接資料庫，無法使用討論室功能。</p>
                    </div>
                );
            }

            return (
                <div className="max-w-4xl mx-auto h-[calc(100vh-80px)] flex flex-col p-2 md:p-4">
                    <div className="bg-white flex-1 rounded-xl shadow-sm border border-slate-200 flex flex-col overflow-hidden">
                        
                        <div className="bg-slate-800 p-4 text-white">
                            <h2 className="font-bold text-lg flex items-center">
                                💬 考生戰情討論室
                                <span className="ml-2 px-2 py-0.5 bg-green-500 text-xs rounded-full">{messages.length} 則討論</span>
                            </h2>
                            <p className="text-slate-300 text-xs mt-1">互相解題、分享多項式函數的速解技巧或圖形記憶法！</p>
                        </div>

                        {!isLoggedIn ? (
                            <div className="flex-1 flex items-center justify-center bg-slate-50">
                                <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-slate-800"></div>
                            </div>
                        ) : (
                            <>
                                <div className="flex-1 overflow-y-auto p-4 chat-scroll space-y-4 bg-slate-50">
                                    {messages.map((msg) => {
                                        const isMe = msg.userId === window.auth.currentUser?.uid;
                                        return (
                                            <div key={msg.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                                                <span className="text-xs text-slate-500 mb-1 px-1">{msg.user}</span>
                                                <div className={`max-w-[75%] p-3 rounded-2xl ${isMe ? 'bg-indigo-500 text-white rounded-tr-none' : 'bg-white border border-slate-200 text-slate-800 rounded-tl-none'}`}>
                                                    <span dangerouslySetInnerHTML={{ __html: msg.text.replace(/\n/g, '<br/>') }} className="break-words"/>
                                                </div>
                                            </div>
                                        );
                                    })}
                                    <div ref={messagesEndRef} />
                                </div>

                                <form onSubmit={handleSend} className="p-3 bg-white border-t border-slate-200 flex flex-col sm:flex-row gap-2">
                                    <input 
                                        type="text" 
                                        placeholder="你的暱稱 (例: 建中金城武)" 
                                        value={username}
                                        onChange={(e) => setUsername(e.target.value)}
                                        className="w-full sm:w-1/4 border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-slate-800 outline-none text-sm"
                                        maxLength="15"
                                        required
                                    />
                                    <div className="flex flex-1 gap-2">
                                        <input 
                                            type="text" 
                                            placeholder="輸入討論內容..." 
                                            value={input}
                                            onChange={(e) => setInput(e.target.value)}
                                            className="flex-1 border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-slate-800 outline-none"
                                            required
                                        />
                                        <button type="submit" className="bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-900 font-medium whitespace-nowrap">
                                            發送
                                        </button>
                                    </div>
                                </form>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentView, setCurrentView] = useState('test'); // 'test', 'tutor', 'discussion'
            const [tutorInitialMsg, setTutorInitialMsg] = useState('');

            const navigateToTutor = (msg) => {
                setTutorInitialMsg(msg);
                setCurrentView('tutor');
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Navbar */}
                    <nav className="bg-white shadow-sm sticky top-0 z-10">
                        <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-2">
                                <span className="text-2xl">🎯</span>
                                <h1 className="font-bold text-slate-800 text-lg hidden sm:block">116學測數學特訓網</h1>
                            </div>
                            <div className="flex space-x-1 sm:space-x-4 bg-slate-100 p-1 rounded-lg">
                                <button 
                                    onClick={() => setCurrentView('test')}
                                    className={`px-3 py-1.5 text-sm font-medium rounded-md transition-colors ${currentView === 'test' ? 'bg-white shadow text-slate-800' : 'text-slate-500 hover:text-slate-700'}`}
                                >📝 模擬測驗</button>
                                <button 
                                    onClick={() => setCurrentView('tutor')}
                                    className={`px-3 py-1.5 text-sm font-medium rounded-md transition-colors ${currentView === 'tutor' ? 'bg-white shadow text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}
                                >👨‍🏫 AI家教</button>
                                <button 
                                    onClick={() => setCurrentView('discussion')}
                                    className={`px-3 py-1.5 text-sm font-medium rounded-md transition-colors ${currentView === 'discussion' ? 'bg-white shadow text-slate-800' : 'text-slate-500 hover:text-slate-700'}`}
                                >💬 討論室</button>
                            </div>
                        </div>
                    </nav>

                    {/* Main Content Area */}
                    <main className="flex-1 mt-4">
                        {currentView === 'test' && <MockTest navigateToTutor={navigateToTutor} />}
                        {currentView === 'tutor' && <TutorChat initialMessage={tutorInitialMsg} />}
                        {currentView === 'discussion' && <DiscussionRoom />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
